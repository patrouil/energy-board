; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:unphone9]
src_dir = src
platform = espressif32 @   6.1.0

board = unphone9
framework = arduino
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi

lib_deps =
    lvgl/lvgl@^8.4.0
    https://gitlab.com/hamishcunningham/unphonelibrary   @ ^9.0.0
    Adafruit BusIO                                       @ ^1.10.0
    Adafruit Unified Sensor                              @ ^1.1.15
    ; https://github.com/hamishcunningham/Adafruit_HX8357_Library
    ; https://github.com/hamishcunningham/arduino-lmic     @ ^4.1.1
    Adafruit LSM6DS                                      @ ^4.7.0
    ;SPI                                                  @ ^2.0.0
    adafruit/SdFat - Adafruit Fork						@ ^2.2.3
    ;WiFi                                                 @ ^2.0.0
    ;WiFiClientSecure                                     @ ^2.0.0
    https://github.com/garethhcoleman/XPT2046_Touchscreen
    ;lnlp/EasyLed                                         @ ^1.1.0
; (if not using `demos/` & `examples/` from LVGL library you don't need fork)
    https://github.com/hamishcunningham/TFT_eSPI
;   @ ^2.4.72
    tobozo/YAMLDuino
    ;ayushsharma82/ElegantOTA								@^3.1.0

lib_ignore =
    MCCI LoRaWAN LMIC library
    WiFi101
    OneWire

build_type = debug
upload_speed = 921600
monitor_speed = 115200
monitor_port =
build_flags =
    -D UNPHONE_LORA=0
    -D UNPHONE_UI0=0
    -D UNPHONE_FACTORY_MODE=0
    #-D UNPHONE_PRODUCTION_BUILD
    -DBOARD_HAS_PSRAM
    -D DISABLE_ALL_LIBRARY_WARNINGS
    -D _GNU_SOURCE
    -D USE_SERIAL
    -D LV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
    -D LV_USE_LOG=1
    #-D LV_LOG_LEVEL=1
    -D LV_USE_DEMO_WIDGETS=0
    -D LV_MEM_CUSTOM=1
    -D LV_TICK_CUSTOM=1
    -D TFT_eSPI_DEBUG


