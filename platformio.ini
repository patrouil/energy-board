; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:unphone9]
src_dir = src
platform = espressif32 @   6.1.0
; 6.0.1
;platform = https://github.com/hamishcunningham/platform-espressif32
board = unphone9
framework = arduino
monitor_filters = esp32_exception_decoder
board_build.psram = enable

lib_deps =
    lvgl/lvgl@^8.4.0
    https://gitlab.com/hamishcunningham/unphonelibrary
; @ ^9.0.0
    Adafruit BusIO                                       @ ^1.10.0
    Adafruit Unified Sensor                              @ ^1.1.15
    Adafruit LSM6DS                                      @ ^4.7.0
    adafruit/SdFat - Adafruit Fork						@ ^2.3.103
    https://github.com/garethhcoleman/XPT2046_Touchscreen#c766eac271024e65cd26e0316f1d9726f365542c
    https://github.com/hamishcunningham/TFT_eSPI
    tobozo/YAMLDuino

lib_ignore =
    MCCI LoRaWAN LMIC library
    WiFi101
    OneWire

build_type = debug
upload_speed = 921600
monitor_speed = 115200
monitor_port =
build_flags =
    -D UNPHONE_LORA=0
    -D UNPHONE_UI0=0
    -D UNPHONE_FACTORY_MODE=0
    #-D UNPHONE_PRODUCTION_BUILD
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D DISABLE_PING
    -D DISABLE_BEACONS
    -D USE_ORIGINAL_AES
    -D CFG_eu868=1
    -D CFG_sx1276_radio=1
    -D hal_init=LMICHAL_init
    -D _GNU_SOURCE
    -D LMIC_PRINTF_TO=Serial
    -D USE_SERIAL
    -D USE_LED
    # -D LV_CONF_SKIP
    -D LV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
    -D LV_USE_LOG=1
    #-D LV_LOG_LEVEL=1
    -D LV_USE_DEMO_WIDGETS=0
    #-D LV_MEM_SIZE=98304U
    -D LV_MEM_CUSTOM=1
    -D LV_TICK_CUSTOM=1
    -D TFT_eSPI_DEBUG


